services:
  postgres:
    image: postgres:16-alpine
    container_name: newtonite-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: newtonite_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d newtonite_db"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
